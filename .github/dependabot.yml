# Keep the automation on this repository current: only the GitHub Actions
# versions are watched. The formula itself is updated by the release pipeline
# in SunnyJayaRaju/oc-model-manager, not by Dependabot.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One grouped PR for every action bump, so the handful of CI actions here
    # arrive together instead of as separate pull requests.
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
